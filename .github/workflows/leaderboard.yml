name: Verify score
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  verify:
    if: startsWith(github.event.issue.title, '[score]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify replay and save
        env:
          REPORT: ${{ runner.temp }}/report.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node tools/verify-issue.js
            git diff --quiet data/leaderboard.json && exit 0
            git commit -m "chore: update leaderboard" data/leaderboard.json
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - name: Reply, close, redeploy
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/report.md"
          if grep -q "✅" "$RUNNER_TEMP/report.md"; then
            gh issue close "$NUMBER"
            gh workflow run deploy.yml --ref main
          fi
